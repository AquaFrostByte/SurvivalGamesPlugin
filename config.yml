# ============================================================================
#  VARO plugin for Minecraft 1.7.10 - everything is configurable here.
#  Colors: use &-codes. Keep scoreboard lines under ~28 visible characters.
#  Keep this file ASCII (use \uXXXX escapes for symbols).
#  Staff who must NOT take part in the match need the permission varo.bypass.
# ============================================================================
general:
  prefix: "&8[&6VARO&8] &7"
  world: "world"                    # world used for scatter
  save-interval-seconds: 60

game:
  countdown-seconds: 30
  countdown-announce: [60, 30, 20, 10, 5, 4, 3, 2, 1]
  countdown-sound: "NOTE_PLING"
  start-sound: "ENDERDRAGON_GROWL"
  win-sound: "LEVEL_UP"
  auto-scatter-on-start: true       # /varo start scatters automatically if not done yet
  auto-solo-teams: true             # players without a team get a 1-man team on scatter
  deny-non-participants: true       # after start, only participants/staff can join

time:
  daily-minutes: 15
  one-session-per-day: false        # true = leaving ends your time for today
  reset-mode: FIXED_TIME            # FIXED_TIME (real clock) or MANUAL (/varo nextday)
  reset-time: "00:00"
  timezone: "SYSTEM"                # SYSTEM or e.g. Europe/Berlin
  manual-reset-text: "the next VARO day"
  warnings-seconds: [300, 120, 60, 30, 10, 5, 4, 3, 2, 1]
  warning-sound: "NOTE_PLING"
  play-window:
    enabled: false                  # players may only play between start and end
    start: "18:00"
    end: "22:00"
    kick-at-end: true

spawn:
  scatter-radius: 800
  min-team-distance: 100
  max-attempts: 60
  clear-inventory: true
  dome:
    enabled: true
    radius: 4
    material: GLASS

grace:                              # Schutzzeit - PvP disabled
  enabled: true
  unit: DAYS                        # DAYS or MINUTES
  amount: 2                         # DAYS: PvP on from day amount+1 | MINUTES: after the game started

border:
  enabled: true
  center-x: 0
  center-z: 0
  start-size: 2000                  # side length on day 1
  shrink-per-day: 150
  min-size: 200
  custom-sizes: {}                  # override single days, e.g.  {5: 800, 6: 600}
  wall: true                        # true = can't walk out; false = only damage
  damage-per-second: 2.0            # damage outside the border (0 = off)
  message-interval-seconds: 5
  apply-to-nether: true
  nether-scale: 8
  block-teleport-outside: true      # ender pearls out of the border
  visual:
    enabled: true
    distance: 8
    effect: MOBSPAWNER_FLAMES

dimensions:
  nether-unlock-day: 3
  end-unlock-day: 6

death:
  mode: BAN                         # BAN (kicked + can't rejoin) or SPECTATOR (emulated, 1.7.10 has no spectator mode)
  lightning: true
  sound: AMBIENCE_THUNDER
  kick-delay-ticks: 40
  keep-inventory: false
  spectator:
    invisible: true
    hide-from-players: true

teams:
  max-size: 2
  max-name-length: 12
  friendly-fire: false
  lock-after-scatter: true          # no team changes once players were scattered
  invite-expire-seconds: 60
  nametag-colors: true
  chat-format: "&8[&b%team%&8] &f%player%&7: &f%message%"
  colors: [RED, BLUE, GREEN, YELLOW, AQUA, LIGHT_PURPLE, GOLD, DARK_GREEN, DARK_AQUA, DARK_PURPLE, DARK_RED, WHITE]

combat:
  enabled: true
  tag-seconds: 15
  mode: NPC                         # NPC (villager stays), KILL (instant death) or NONE
  npc-lifetime-seconds: 60
  apply-on-time-expiry: true        # being kicked by the time limit while tagged counts as combat log
  block-commands: true
  allowed-commands: [tc, msg, tell, r, team]

scoreboard:
  enabled: true
  title: "&6&lVARO"
  below-name-health: true
  below-name-label: "&c\u2764"
  # Placeholders: %day% %time% %reset% %border% %nextborder% %safe% %players% %teams%
  #               %grace% %combat% %mates%   (empty results are skipped; "" = spacer)
  lines:
    - "&7Day: &f%day%"
    - ""
    - "&eTime left: &f%time%"
    - "&eBorder: &f%border%"
    - "&7Next day: &f%nextborder%"
    - "%safe%"
    - ""
    - "&aPlayers: &f%players%"
    - "&aTeams: &f%teams%"
    - "%grace%"
    - "%combat%"
    - "%mates%"
  safe-text: "&a\u2714 Safe tomorrow"
  unsafe-text: "&c\u2718 Move! %dist%m"
  grace-active: "&bGrace: &f%left%"
  grace-over: "&cPvP enabled"
  combat-text: "&cCombat: &f%time%s"
  mate-line: "&c\u2764 &f%name% &c%health%"
  mate-offline: "&7%name% (offline)"
  mate-dead: "&7%name% (dead)"

nerfs:
  disabled-crafting: ["GOLDEN_APPLE:1"]      # MATERIAL or MATERIAL:data
  disabled-consume: ["GOLDEN_APPLE:1"]
  potions:
    enabled: true
    max-amplifier: 0                          # 0 = only level I (blocks Strength II, Speed II ...), -1 = off
    blocked-effects: []                       # e.g. [INCREASE_DAMAGE, REGENERATION]
    blocked-brew-ingredients: [GLOWSTONE_DUST]
  enchantments:
    enabled: true
    default-max-level: 0                      # 0 = vanilla
    max-levels:
      DAMAGE_ALL: 3                           # Sharpness III max (names: Bukkit enchantment names)
    disabled: []

anti-portal-trap:
  enabled: true
  radius: 4
  blocked-blocks: [LAVA, OBSIDIAN]

strikes:
  max: 3                                      # 0 = never eliminate
  time-penalty-minutes: 0                     # removed from today's remaining time per strike

trophy:
  enabled: true
  only-pvp: true
  name: "&6%player%'s Head"
  lore: ["&7Killed by &c%killer%"]
  unknown-killer: "unknown"

